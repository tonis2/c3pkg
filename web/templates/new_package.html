{{define "content"}}
<section class="card form-card">
  <h1>New package</h1>
  <p class="muted">The package name comes from <span class="mono">provides</span> in the library's manifest.</p>
  <form method="post" action="/dashboard/packages/new" enctype="multipart/form-data" novalidate>
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{template "file_field" .}}
    {{template "version_fields" .}}
    {{template "meta_fields" .}}
    {{template "readme_field" .}}
    <button class="btn btn-primary" type="submit">Publish package</button>
  </form>
</section>
{{end}}
