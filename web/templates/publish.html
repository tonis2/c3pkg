{{define "content"}}
<section class="card form-card">
  <h1>Publish an update to <span class="mono">{{.Data.Pkg.Name}}</span></h1>
  <p class="muted">Published versions can't be changed or replaced. Use a new version number.</p>
  <form method="post" action="/dashboard/packages/{{.Data.Pkg.Name}}/publish" enctype="multipart/form-data" novalidate>
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    {{template "file_field" .}}
    {{template "version_fields" .}}
    <button class="btn btn-primary" type="submit">Publish version</button>
    <a class="btn" href="/packages/{{.Data.Pkg.Name}}">Cancel</a>
  </form>
</section>
{{end}}
